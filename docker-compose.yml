version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./haalsi.db
      - SECRET_KEY=haalsi_production_super_secret_jwt_key_2026_clinical
      - DEPLOYMENT_MODE=clinical_evaluation
    volumes:
      - ./outputs:/app/outputs
      - ./haalsi.db:/app/haalsi.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
